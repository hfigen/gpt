name: Build Budget Manager IPA

on:
  push:
    paths:
      - '.github/workflows/build-budget-ipa.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create project
        run: |
          mkdir -p BudgetManager/App BudgetManager/Resources
          cat > BudgetManager/project.yml <<'EOF'
          name: BudgetManager
          options:
            deploymentTarget:
              iOS: "16.0"
          targets:
            BudgetManager:
              type: application
              platform: iOS
              sources:
                - path: App
              resources:
                - path: Resources
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.hfigen.budgetmanager
                  PRODUCT_NAME: BudgetManager
                  PRODUCT_MODULE_NAME: BudgetManager
                  CURRENT_PROJECT_VERSION: 8
                  MARKETING_VERSION: 1.2.5
                  GENERATE_INFOPLIST_FILE: NO
                  INFOPLIST_FILE: App/Info.plist
                  TARGETED_DEVICE_FAMILY: "1"
                  SWIFT_VERSION: "5.0"
                  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
          EOF

          cat > BudgetManager/App/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>$(DEVELOPMENT_LANGUAGE)</string>
              <key>CFBundleDisplayName</key>
              <string>Мой бюджет</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>$(PRODUCT_NAME)</string>
              <key>CFBundlePackageType</key>
              <string>$(PRODUCT_BUNDLE_PACKAGE_TYPE)</string>
              <key>CFBundleShortVersionString</key>
              <string>$(MARKETING_VERSION)</string>
              <key>CFBundleVersion</key>
              <string>$(CURRENT_PROJECT_VERSION)</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
              <key>UIRequiresFullScreen</key>
              <true/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          PLIST

          cat > BudgetManager/Resources/LaunchScreen.storyboard <<'STORYBOARD'
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0" toolsVersion="23096" targetRuntime="iOS.CocoaTouch" propertyAccessControl="none" useAutolayout="YES" launchScreen="YES" colorMatched="YES" initialViewController="01J-lp-oVM">
              <device id="retina6_12" orientation="portrait" appearance="light"/>
              <dependencies>
                  <plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="23084"/>
                  <capability name="Safe area layout guides" minToolsVersion="9.0"/>
                  <capability name="documents saved in the Xcode 8 format" minToolsVersion="8.0"/>
              </dependencies>
              <scenes>
                  <scene sceneID="EHf-IW-A2E">
                      <objects>
                          <viewController id="01J-lp-oVM" sceneMemberID="viewController">
                              <view key="view" contentMode="scaleToFill" id="Ze5-6b-2t3">
                                  <rect key="frame" x="0.0" y="0.0" width="393" height="852"/>
                                  <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                                  <viewLayoutGuide key="safeArea" id="Bcu-3y-fUS"/>
                                  <color key="backgroundColor" red="0.965" green="0.972" blue="0.988" alpha="1" colorSpace="custom" customColorSpace="sRGB"/>
                              </view>
                          </viewController>
                          <placeholder placeholderIdentifier="IBFirstResponder" id="iYj-Kq-Ea1" userLabel="First Responder" sceneMemberID="firstResponder"/>
                      </objects>
                      <point key="canvasLocation" x="53" y="375"/>
                  </scene>
              </scenes>
          </document>
          STORYBOARD

          cat > BudgetManager/App/BudgetManagerApp.swift <<'SWIFT'
          import SwiftUI
          import Charts
          
          enum BudgetCategory: String, Codable, CaseIterable, Identifiable {
              case food, fun, other
              case rent, gptSubscription, mobile, internet

              var id: String { rawValue }

              var title: String {
                  switch self {
                  case .food: return "Еда"
                  case .fun: return "Развлечения"
                  case .other: return "Прочее"
                  case .rent: return "Квартира"
                  case .gptSubscription: return "Подписка GPT"
                  case .mobile: return "Мобильная связь"
                  case .internet: return "Интернет"
                  }
              }

              var limit: Double {
                  switch self {
                  case .food: return 35_500
                  case .fun: return 10_000
                  case .other: return 14_000
                  case .rent: return 35_000
                  case .gptSubscription: return 2_000
                  case .mobile: return 500
                  case .internet: return 1_000
                  }
              }

              var countsAgainstFreeBudget: Bool {
                  switch self {
                  case .food, .fun, .other:
                      return true
                  case .rent, .gptSubscription, .mobile, .internet:
                      return false
                  }
              }

              static var freeBudgetCategories: [BudgetCategory] {
                  [.food, .fun, .other]
              }
          }
          
          struct Expense: Identifiable, Codable {
              var id: UUID = UUID()
              var amount: Double
              var category: BudgetCategory
              var note: String
              var date: Date
          }

          struct SavingsEntry: Identifiable, Codable {
              var id: UUID = UUID()
              var amount: Double
              var note: String
              var date: Date
          }
          
          final class BudgetStore: ObservableObject {
              @Published var expenses: [Expense] = [] {
                  didSet { saveExpenses() }
              }

              @Published var savings: [SavingsEntry] = [] {
                  didSet { saveSavings() }
              }

              private let expenseKey = "budget_manager_expenses_v1"
              private let savingsKey = "budget_manager_savings_v1"

              init() {
                  let decoder = JSONDecoder()
                  decoder.dateDecodingStrategy = .iso8601

                  if let data = UserDefaults.standard.data(forKey: expenseKey),
                     let saved = try? decoder.decode([Expense].self, from: data) {
                      expenses = saved
                  }

                  if let data = UserDefaults.standard.data(forKey: savingsKey),
                     let saved = try? decoder.decode([SavingsEntry].self, from: data) {
                      savings = saved
                  }
              }

              private func saveExpenses() {
                  let encoder = JSONEncoder()
                  encoder.dateEncodingStrategy = .iso8601
                  if let data = try? encoder.encode(expenses) {
                      UserDefaults.standard.set(data, forKey: expenseKey)
                  }
              }

              private func saveSavings() {
                  let encoder = JSONEncoder()
                  encoder.dateEncodingStrategy = .iso8601
                  if let data = try? encoder.encode(savings) {
                      UserDefaults.standard.set(data, forKey: savingsKey)
                  }
              }

              func add(amount: Double, category: BudgetCategory, note: String, date: Date) {
                  expenses.append(Expense(amount: amount, category: category, note: note, date: date))
              }

              func update(_ expense: Expense, amount: Double, category: BudgetCategory, note: String, date: Date) {
                  guard let index = expenses.firstIndex(where: { $0.id == expense.id }) else { return }
                  expenses[index] = Expense(
                      id: expense.id,
                      amount: amount,
                      category: category,
                      note: note,
                      date: date
                  )
              }

              func delete(_ expense: Expense) {
                  expenses.removeAll { $0.id == expense.id }
              }

              func addSaving(amount: Double, note: String, date: Date) {
                  savings.append(SavingsEntry(amount: amount, note: note, date: date))
              }

              func deleteSaving(_ entry: SavingsEntry) {
                  savings.removeAll { $0.id == entry.id }
              }
          }

          struct BudgetPeriod {
              let start: Date
              let nextPayday: Date
              let freeBudget: Double
          }
          
          struct Bill: Identifiable {
              let id = UUID()
              let day: Int
              let title: String
              let amount: Double
              let lastDayOfMonth: Bool
          
              init(day: Int, title: String, amount: Double, lastDayOfMonth: Bool = false) {
                  self.day = day
                  self.title = title
                  self.amount = amount
                  self.lastDayOfMonth = lastDayOfMonth
              }
          }
          
          private let bills: [Bill] = [
              Bill(day: 4, title: "Интернет", amount: 1_000),
              Bill(day: 13, title: "Цветы / подарок", amount: 3_000),
              Bill(day: 14, title: "Квартира", amount: 35_000),
              Bill(day: 26, title: "Подписка GPT", amount: 2_000),
              Bill(day: 31, title: "Проездной + мобильный", amount: 3_500, lastDayOfMonth: true)
          ]
          
          func startOfDay(_ date: Date) -> Date {
              Calendar.current.startOfDay(for: date)
          }
          
          func makeDate(year: Int, month: Int, day: Int) -> Date {
              Calendar.current.date(from: DateComponents(year: year, month: month, day: day)) ?? Date()
          }
          
          func period(for now: Date) -> BudgetPeriod {
              let cal = Calendar.current
              let c = cal.dateComponents([.year, .month, .day], from: now)
              let y = c.year!
              let m = c.month!
              let d = c.day!
          
              if d >= 7 && d < 17 {
                  return BudgetPeriod(
                      start: makeDate(year: y, month: m, day: 7),
                      nextPayday: makeDate(year: y, month: m, day: 17),
                      freeBudget: 17_000
                  )
              }
          
              if d >= 17 && d < 22 {
                  return BudgetPeriod(
                      start: makeDate(year: y, month: m, day: 17),
                      nextPayday: makeDate(year: y, month: m, day: 22),
                      freeBudget: 14_000
                  )
              }
          
              if d >= 22 {
                  let next = cal.date(byAdding: .month, value: 1, to: makeDate(year: y, month: m, day: 7))!
                  return BudgetPeriod(
                      start: makeDate(year: y, month: m, day: 22),
                      nextPayday: next,
                      freeBudget: 28_500
                  )
              }
          
              let prevMonth = cal.date(byAdding: .month, value: -1, to: now)!
              let pc = cal.dateComponents([.year, .month], from: prevMonth)
              return BudgetPeriod(
                  start: makeDate(year: pc.year!, month: pc.month!, day: 22),
                  nextPayday: makeDate(year: y, month: m, day: 7),
                  freeBudget: 28_500
              )
          }
          
          func money(_ value: Double) -> String {
              let formatter = NumberFormatter()
              formatter.numberStyle = .decimal
              formatter.maximumFractionDigits = 0
              formatter.groupingSeparator = "\u{202F}"
              return (formatter.string(from: NSNumber(value: max(0, value))) ?? "0") + "\u{00A0}₽"
          }
          
          func dateShort(_ date: Date) -> String {
              let f = DateFormatter()
              f.locale = Locale(identifier: "ru_RU")
              f.dateFormat = "d MMMM"
              return f.string(from: date)
          }
          
          func dateFull(_ date: Date) -> String {
              let f = DateFormatter()
              f.locale = Locale(identifier: "ru_RU")
              f.dateFormat = "EEEE, d MMMM"
              return f.string(from: date)
          }
          
          func dayCaption(_ date: Date) -> String {
              let f = DateFormatter()
              f.locale = Locale(identifier: "ru_RU")
              f.dateFormat = "E, d MMM"
              return f.string(from: date)
          }
          
          extension Color {
              static let budgetBG = Color(red: 0.965, green: 0.972, blue: 0.988)
              static let budgetText = Color(red: 0.06, green: 0.09, blue: 0.17)
              static let budgetMuted = Color(red: 0.39, green: 0.46, blue: 0.57)
              static let budgetGreen = Color(red: 0.92, green: 0.99, blue: 0.96)
              static let budgetFood = Color(red: 1.0, green: 0.96, blue: 0.78)
              static let budgetFun = Color(red: 0.94, green: 0.92, blue: 1.0)
              static let budgetOther = Color(red: 0.88, green: 0.94, blue: 1.0)
          }
          
          struct CardModifier: ViewModifier {
              func body(content: Content) -> some View {
                  content
                      .padding(18)
                      .background(Color.white)
                      .clipShape(RoundedRectangle(cornerRadius: 24, style: .continuous))
                      .overlay(RoundedRectangle(cornerRadius: 24, style: .continuous).stroke(Color.black.opacity(0.06)))
              }
          }
          
          extension View {
              func budgetCard() -> some View { modifier(CardModifier()) }
          }
          
          struct ContentView: View {
              @EnvironmentObject var store: BudgetStore
              @State private var showAdd = false
              @State private var expenseToEdit: Expense?
          
              private var now: Date { startOfDay(Date()) }
              private var current: BudgetPeriod { period(for: now) }
          
              private var periodExpenses: [Expense] {
                  store.expenses.filter {
                      $0.date >= current.start &&
                      $0.date < current.nextPayday &&
                      $0.category.countsAgainstFreeBudget
                  }
              }
          
              private var periodSpent: Double {
                  periodExpenses.reduce(0) { $0 + $1.amount }
              }
          
              private var remaining: Double {
                  max(0, current.freeBudget - periodSpent)
              }
          
              private var daysLeft: Int {
                  max(1, Calendar.current.dateComponents([.day], from: now, to: current.nextPayday).day ?? 1)
              }
          
              private var dailyLimit: Double {
                  remaining / Double(daysLeft)
              }
          
              private var spentToday: Double {
                  store.expenses.filter {
                      Calendar.current.isDate($0.date, inSameDayAs: now) &&
                      $0.category.countsAgainstFreeBudget
                  }.reduce(0) { $0 + $1.amount }
              }
          
              private func categorySpentMonthly(_ category: BudgetCategory) -> Double {
                  let cal = Calendar.current
                  return store.expenses.filter {
                      $0.category == category &&
                      cal.component(.year, from: $0.date) == cal.component(.year, from: now) &&
                      cal.component(.month, from: $0.date) == cal.component(.month, from: now)
                  }.reduce(0) { $0 + $1.amount }
              }

              private func categorySpentInPeriod(_ category: BudgetCategory) -> Double {
                  store.expenses.filter {
                      $0.category == category &&
                      $0.date >= current.start &&
                      $0.date < current.nextPayday
                  }.reduce(0) { $0 + $1.amount }
              }

              private func periodCategoryLimit(_ category: BudgetCategory) -> Double {
                  let totalMonthlyFreeBudget: Double = 59_500

                  let food = (current.freeBudget * 35_500 / totalMonthlyFreeBudget).rounded()
                  let fun = (current.freeBudget * 10_000 / totalMonthlyFreeBudget).rounded()
                  let other = max(0, current.freeBudget - food - fun)

                  switch category {
                  case .food: return food
                  case .fun: return fun
                  case .other: return other
                  default: return category.limit
                  }
              }
          
              private func nextBillDate(_ bill: Bill) -> Date {
                  let cal = Calendar.current
                  var comps = cal.dateComponents([.year, .month], from: now)
                  let year = comps.year!
                  let month = comps.month!
          
                  func dateInMonth(year: Int, month: Int) -> Date {
                      let base = makeDate(year: year, month: month, day: 1)
                      let range = cal.range(of: .day, in: .month, for: base)!
                      let day = bill.lastDayOfMonth ? range.count : min(bill.day, range.count)
                      return makeDate(year: year, month: month, day: day)
                  }
          
                  let thisMonth = dateInMonth(year: year, month: month)
                  if thisMonth >= now { return thisMonth }
          
                  let nextMonth = cal.date(byAdding: .month, value: 1, to: makeDate(year: year, month: month, day: 1))!
                  comps = cal.dateComponents([.year, .month], from: nextMonth)
                  return dateInMonth(year: comps.year!, month: comps.month!)
              }
          
              private var upcomingBills: [(Bill, Date)] {
                  bills
                      .map { ($0, nextBillDate($0)) }
                      .filter { $0.1 < current.nextPayday }
                      .sorted { $0.1 < $1.1 }
              }
          
              var body: some View {
                  NavigationStack {
                      ScrollView {
                          LazyVStack(spacing: 14) {
                              header
                              hero
                              metrics
                              forecast
                              categorySection
                              if !upcomingBills.isEmpty { billsSection }
                              historySection
                          }
                          .padding(.horizontal, 16)
                          .padding(.bottom, 28)
                      }
                      .background(Color.budgetBG.ignoresSafeArea())
                      .toolbar(.hidden, for: .navigationBar)
                      .sheet(isPresented: $showAdd) {
                          AddExpenseView()
                              .environmentObject(store)
                      }
                      .sheet(item: $expenseToEdit) { expense in
                          EditExpenseView(expense: expense)
                              .environmentObject(store)
                      }
                  }
                  .preferredColorScheme(.light)
              }
          
              private var header: some View {
                  HStack(alignment: .top) {
                      VStack(alignment: .leading, spacing: 3) {
                          Text("Мой бюджет")
                              .font(.system(size: 34, weight: .bold))
                              .foregroundStyle(Color.budgetText)
                          Text(dateFull(now))
                              .font(.system(size: 16))
                              .foregroundStyle(Color.budgetMuted)
                      }
                      Spacer()
                      Button {
                          showAdd = true
                      } label: {
                          Label("расход", systemImage: "plus")
                              .font(.system(size: 17, weight: .semibold))
                              .foregroundStyle(Color.budgetText)
                              .padding(.horizontal, 16)
                              .padding(.vertical, 13)
                              .background(Color.white)
                              .clipShape(RoundedRectangle(cornerRadius: 18, style: .continuous))
                              .shadow(color: .black.opacity(0.05), radius: 5, y: 2)
                      }
                  }
                  .padding(.top, 12)
              }
          
              private var hero: some View {
                  VStack(alignment: .leading, spacing: 16) {
                      Text("Период \(dateShort(current.start)) → \(dateShort(current.nextPayday))")
                          .foregroundStyle(Color.budgetMuted)
                          .font(.system(size: 15))
          
                      HStack(alignment: .bottom) {
                          VStack(alignment: .leading, spacing: 5) {
                              Text(money(remaining))
                                  .font(.system(size: 44, weight: .bold))
                                  .lineLimit(1)
                                  .minimumScaleFactor(0.72)
                                  .allowsTightening(true)
                                  .foregroundStyle(Color.budgetText)
                              Text("осталось до следующей выплаты")
                                  .foregroundStyle(Color.budgetMuted)
                                  .font(.system(size: 15))
                          }
                          Spacer()
                          VStack(alignment: .trailing, spacing: 3) {
                              Text("Следующая выплата")
                                  .foregroundStyle(Color.budgetMuted)
                                  .font(.system(size: 13))
                              Text(dateShort(current.nextPayday))
                                  .font(.system(size: 18, weight: .bold))
                                  .foregroundStyle(Color.budgetText)
                          }
                      }
          
                      ProgressView(value: min(1, periodSpent / current.freeBudget))
                          .tint(Color.budgetText)
                          .scaleEffect(x: 1, y: 1.8)
          
                      Text(periodSpent <= current.freeBudget
                           ? "Темп в норме. Потрачено \(money(periodSpent)) из \(money(current.freeBudget)) свободного бюджета периода."
                           : "Есть перерасход относительно свободного бюджета периода.")
                          .font(.system(size: 14))
                          .foregroundStyle(Color(red: 0.03, green: 0.48, blue: 0.36))
                          .padding(14)
                          .frame(maxWidth: .infinity, alignment: .leading)
                          .background(Color.budgetGreen)
                          .clipShape(RoundedRectangle(cornerRadius: 18, style: .continuous))
                  }
                  .budgetCard()
              }
          
              private var metrics: some View {
                  HStack(spacing: 12) {
                      VStack(alignment: .leading, spacing: 8) {
                          Text("Можно тратить сегодня")
                              .font(.system(size: 14))
                              .foregroundStyle(Color.budgetMuted)
                          Text(money(dailyLimit))
                              .font(.system(size: 28, weight: .bold))
                          Text("\(daysLeft) \(daysWord(daysLeft)) до выплаты")
                              .font(.system(size: 13))
                              .foregroundStyle(Color.budgetMuted)
                      }
                      .frame(maxWidth: .infinity, minHeight: 118, alignment: .topLeading)
                      .budgetCard()
          
                      VStack(alignment: .leading, spacing: 8) {
                          Text("Потрачено сегодня")
                              .font(.system(size: 14))
                              .foregroundStyle(Color.budgetMuted)
                          Text(money(spentToday))
                              .font(.system(size: 28, weight: .bold))
                          Text(spentToday <= dailyLimit ? "в пределах лимита" : "выше дневного лимита")
                              .font(.system(size: 13))
                              .foregroundStyle(Color.budgetMuted)
                      }
                      .frame(maxWidth: .infinity, minHeight: 118, alignment: .topLeading)
                      .budgetCard()
                  }
              }
          
              private var forecast: some View {
                  VStack(alignment: .leading, spacing: 14) {
                      Text("До следующей выплаты")
                          .font(.system(size: 22, weight: .bold))
          
                      ScrollView(.horizontal, showsIndicators: false) {
                          HStack(spacing: 10) {
                              ForEach(0..<min(daysLeft, 14), id: \.self) { offset in
                                  let date = Calendar.current.date(byAdding: .day, value: offset, to: now)!
                                  VStack(alignment: .leading, spacing: 5) {
                                      Text(offset == 0 ? "Сегодня" : dayCaption(date))
                                          .font(.system(size: 13))
                                          .foregroundStyle(Color.budgetMuted)
                                      Text(money(offset == 0 ? max(0, dailyLimit - spentToday) : dailyLimit))
                                          .font(.system(size: 19, weight: .bold))
                                      Text(offset == 0 ? "ещё сегодня" : "ориентир")
                                          .font(.system(size: 12))
                                          .foregroundStyle(Color.budgetMuted)
                                  }
                                  .padding(14)
                                  .frame(width: 128, alignment: .leading)
                                  .background(Color.white)
                                  .clipShape(RoundedRectangle(cornerRadius: 18, style: .continuous))
                                  .overlay(RoundedRectangle(cornerRadius: 18, style: .continuous).stroke(offset == 0 ? Color.gray.opacity(0.55) : Color.black.opacity(0.06)))
                              }
                          }
                      }
                  }
                  .budgetCard()
              }
          
              private var categorySection: some View {
                  VStack(alignment: .leading, spacing: 14) {
                      VStack(alignment: .leading, spacing: 3) {
                          Text("Лимиты до \(dateShort(current.nextPayday))")
                              .font(.system(size: 22, weight: .bold))
                          Text("Распределены пропорционально свободному бюджету текущего периода")
                              .font(.system(size: 12))
                              .foregroundStyle(Color.budgetMuted)
                      }

                      ForEach(BudgetCategory.freeBudgetCategories) { category in
                          let periodLimit = periodCategoryLimit(category)
                          let periodSpent = categorySpentInPeriod(category)
                          let periodRemain = max(0, periodLimit - periodSpent)
                          let monthSpent = categorySpentMonthly(category)

                          VStack(alignment: .leading, spacing: 7) {
                              HStack {
                                  Text(category.title)
                                      .font(.system(size: 18, weight: .bold))
                                  Spacer()
                                  Text(money(periodRemain))
                                      .font(.system(size: 18, weight: .bold))
                              }

                              Text("потрачено \(money(periodSpent)) из \(money(periodLimit)) до \(dateShort(current.nextPayday))")
                                  .font(.system(size: 13))
                                  .foregroundStyle(Color.budgetMuted)

                              Text("За месяц: \(money(monthSpent)) из \(money(category.limit))")
                                  .font(.system(size: 11))
                                  .foregroundStyle(Color.budgetMuted.opacity(0.85))
                          }
                          .padding(16)
                          .background(categoryColor(category))
                          .clipShape(RoundedRectangle(cornerRadius: 20, style: .continuous))
                      }
                  }
                  .budgetCard()
              }
          
              private var billsSection: some View {
                  VStack(alignment: .leading, spacing: 12) {
                      Text("Обязательные платежи до выплаты")
                          .font(.system(size: 22, weight: .bold))
          
                      ForEach(upcomingBills, id: \.0.id) { item in
                          HStack {
                              VStack(alignment: .leading, spacing: 3) {
                                  Text(item.0.title)
                                      .font(.system(size: 16, weight: .semibold))
                                  Text(dateShort(item.1))
                                      .font(.system(size: 13))
                                      .foregroundStyle(Color.budgetMuted)
                              }
                              Spacer()

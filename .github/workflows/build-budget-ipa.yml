          struct RootView: View {
              var body: some View {
                  TabView {
                      ContentView()
                          .tabItem {
                              Label("Бюджет", systemImage: "wallet.pass")
                          }

                      SavingsView()
                          .tabItem {
                              Label("Накопления", systemImage: "banknote")
                          }

                      AnalyticsView()
                          .tabItem {
                              Label("Аналитика", systemImage: "chart.xyaxis.line")
                          }

                      WikiView()
                          .tabItem {
                              Label("Вики", systemImage: "book.closed")
                          }
                  }
                  .tint(Color.budgetText)
              }
          }

          @main
          struct BudgetManagerApp: App {
              @StateObject private var store = BudgetStore()
          
              var body: some Scene {
                  WindowGroup {
                      RootView()
                          .environmentObject(store)
                  }
              }
          }
          
          SWIFT

          cd BudgetManager
          xcodegen generate

      - name: Build unsigned app
        run: |
          cd BudgetManager
          xcodebuild \
            -project BudgetManager.xcodeproj \
            -scheme BudgetManager \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          cd BudgetManager
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BudgetManager.app Payload/
          zip -qry BudgetManager-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BudgetManager-unsigned
          path: BudgetManager/BudgetManager-unsigned.ipa
          retention-days: 7

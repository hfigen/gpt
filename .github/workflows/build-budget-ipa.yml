          struct DailySpendPoint: Identifiable {
              let id = UUID()
              let date: Date
              let amount: Double
          }

          struct AnalyticsView: View {
              @EnvironmentObject var store: BudgetStore

              private var now: Date { startOfDay(Date()) }

              private var monthInterval: DateInterval {
                  Calendar.current.dateInterval(of: .month, for: now)!
              }

              private var monthExpenses: [Expense] {
                  store.expenses.filter { monthInterval.contains($0.date) }
              }

              private var dailyData: [DailySpendPoint] {
                  let cal = Calendar.current
                  let start = monthInterval.start
                  let today = now
                  let days = max(1, cal.dateComponents([.day], from: start, to: today).day ?? 0)

                  return (0...days).map { offset in
                      let day = cal.date(byAdding: .day, value: offset, to: start)!
                      let total = monthExpenses
                          .filter { cal.isDate($0.date, inSameDayAs: day) }
                          .reduce(0) { $0 + $1.amount }
                      return DailySpendPoint(date: day, amount: total)
                  }
              }

              private var monthTotal: Double {
                  monthExpenses.reduce(0) { $0 + $1.amount }
              }

              private var activeDays: Int {
                  dailyData.filter { $0.amount > 0 }.count
              }

              private var averagePerActiveDay: Double {
                  activeDays == 0 ? 0 : monthTotal / Double(activeDays)
              }

              private var maxDay: DailySpendPoint? {
                  dailyData.max { $0.amount < $1.amount }
              }

              var body: some View {
                  NavigationStack {
                      ScrollView {
                          LazyVStack(spacing: 14) {
                              VStack(alignment: .leading, spacing: 3) {
                                  Text("Аналитика")
                                      .font(.system(size: 32, weight: .bold))
                                  Text("Динамика трат по дням")
                                      .font(.system(size: 15))
                                      .foregroundStyle(Color.budgetMuted)
                              }
                              .frame(maxWidth: .infinity, alignment: .leading)
                              .padding(.top, 12)

                              VStack(alignment: .leading, spacing: 16) {
                                  HStack {
                                      VStack(alignment: .leading, spacing: 4) {
                                          Text("Траты за месяц")
                                              .font(.system(size: 14))
                                              .foregroundStyle(Color.budgetMuted)
                                          Text(money(monthTotal))
                                              .font(.system(size: 30, weight: .bold))
                                      }
                                      Spacer()
                                      VStack(alignment: .trailing, spacing: 4) {
                                          Text("Среднее в день с тратами")
                                              .font(.system(size: 12))
                                              .foregroundStyle(Color.budgetMuted)
                                          Text(money(averagePerActiveDay))
                                              .font(.system(size: 18, weight: .bold))
                                      }
                                  }

                                  Chart(dailyData) { point in
                                      LineMark(
                                          x: .value("Дата", point.date),
                                          y: .value("Траты", point.amount)
                                      )
                                      .interpolationMethod(.catmullRom)

                                      AreaMark(
                                          x: .value("Дата", point.date),
                                          y: .value("Траты", point.amount)
                                      )
                                      .opacity(0.10)

                                      if point.amount > 0 {
                                          PointMark(
                                              x: .value("Дата", point.date),
                                              y: .value("Траты", point.amount)
                                          )
                                      }
                                  }
                                  .chartXAxis {
                                      AxisMarks(values: .automatic(desiredCount: 6)) { value in
                                          AxisGridLine()
                                          AxisTick()
                                          AxisValueLabel(format: .dateTime.day())
                                      }
                                  }
                                  .chartYAxis {
                                      AxisMarks(position: .leading)
                                  }
                                  .frame(height: 240)
                              }
                              .budgetCard()

                              HStack(spacing: 12) {
                                  VStack(alignment: .leading, spacing: 7) {
                                      Text("Дней с тратами")
                                          .font(.system(size: 14))
                                          .foregroundStyle(Color.budgetMuted)
                                      Text("\(activeDays)")
                                          .font(.system(size: 24, weight: .bold))
                                  }
                                  .frame(maxWidth: .infinity, minHeight: 90, alignment: .topLeading)
                                  .budgetCard()

                                  VStack(alignment: .leading, spacing: 7) {
                                      Text("Максимум за день")
                                          .font(.system(size: 14))
                                          .foregroundStyle(Color.budgetMuted)
                                      Text(money(maxDay?.amount ?? 0))
                                          .font(.system(size: 22, weight: .bold))
                                      if let day = maxDay, day.amount > 0 {
                                          Text(dateShort(day.date))
                                              .font(.system(size: 12))
                                              .foregroundStyle(Color.budgetMuted)
                                      }
                                  }
                                  .frame(maxWidth: .infinity, minHeight: 90, alignment: .topLeading)
                                  .budgetCard()
                              }

                              VStack(alignment: .leading, spacing: 12) {
                                  Text("По категориям за месяц")
                                      .font(.system(size: 22, weight: .bold))

                                  ForEach(BudgetCategory.allCases) { category in
                                      let total = monthExpenses
                                          .filter { $0.category == category }
                                          .reduce(0) { $0 + $1.amount }

                                      HStack {
                                          Text(category.title)
                                          Spacer()
                                          Text(money(total))
                                              .fontWeight(.bold)
                                      }
                                      .font(.system(size: 16))
                                      Divider()
                                  }
                              }
                              .budgetCard()
                          }
                          .padding(.horizontal, 16)
                          .padding(.bottom, 28)
                      }
                      .background(Color.budgetBG.ignoresSafeArea())
                      .toolbar(.hidden, for: .navigationBar)
                  }
              }
          }


name: Build Budget Manager IPA

on:
  push:
    paths:
      - '.github/workflows/build-budget-ipa.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create project
        run: |
          mkdir -p BudgetManager/App
          cat > BudgetManager/project.yml <<'EOF'
          name: BudgetManager
          options:
            deploymentTarget:
              iOS: "16.0"
          targets:
            BudgetManager:
              type: application
              platform: iOS
              sources:
                - path: App
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.hfigen.budgetmanager
                  PRODUCT_NAME: BudgetManager
                  PRODUCT_MODULE_NAME: BudgetManager
                  CURRENT_PROJECT_VERSION: 1
                  MARKETING_VERSION: 1.0
                  GENERATE_INFOPLIST_FILE: YES
                  INFOPLIST_KEY_CFBundleDisplayName: "Мой бюджет"
                  INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
                  INFOPLIST_KEY_UILaunchScreen_Generation: YES
                  TARGETED_DEVICE_FAMILY: "1"
                  SWIFT_VERSION: "5.0"
                  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
          EOF

          cat > BudgetManager/App/BudgetManagerApp.swift <<'SWIFT'
import SwiftUI

enum BudgetCategory: String, Codable, CaseIterable, Identifiable {
    case food, fun, other
    var id: String { rawValue }
    var title: String {
        switch self {
        case .food: return "Еда"
        case .fun: return "Развлечения"
        case .other: return "Прочее"
        }
    }
    var limit: Double {
        switch self {
        case .food: return 35_500
        case .fun: return 10_000
        case .other: return 14_000
        }
    }
}

struct Expense: Identifiable, Codable {
    var id: UUID = UUID()
    var amount: Double
    var category: BudgetCategory
    var note: String
    var date: Date
}

final class BudgetStore: ObservableObject {
    @Published var expenses: [Expense] = [] {
        didSet { save() }
    }

    private let key = "budget_manager_expenses_v1"

    init() {
        guard let data = UserDefaults.standard.data(forKey: key) else { return }
        let decoder = JSONDecoder()
        decoder.dateDecodingStrategy = .iso8601
        if let saved = try? decoder.decode([Expense].self, from: data) {
            expenses = saved
        }
    }

    private func save() {
        let encoder = JSONEncoder()
        encoder.dateEncodingStrategy = .iso8601
        if let data = try? encoder.encode(expenses) {
            UserDefaults.standard.set(data, forKey: key)
        }
    }

    func add(amount: Double, category: BudgetCategory, note: String, date: Date) {
        expenses.append(Expense(amount: amount, category: category, note: note, date: date))
    }

    func delete(_ expense: Expense) {
        expenses.removeAll { $0.id == expense.id }
    }
}

struct BudgetPeriod {
    let start: Date
    let nextPayday: Date
    let freeBudget: Double
}

struct Bill: Identifiable {
    let id = UUID()
    let day: Int
    let title: String
    let amount: Double
    let lastDayOfMonth: Bool

    init(day: Int, title: String, amount: Double, lastDayOfMonth: Bool = false) {
        self.day = day
        self.title = title
        self.amount = amount
        self.lastDayOfMonth = lastDayOfMonth
    }
}

private let bills: [Bill] = [
    Bill(day: 4, title: "Интернет", amount: 1_000),
    Bill(day: 13, title: "Цветы / подарок", amount: 3_000),
    Bill(day: 14, title: "Квартира", amount: 35_000),
    Bill(day: 26, title: "Подписка", amount: 2_000),
    Bill(day: 31, title: "Проездной + мобильный", amount: 3_500, lastDayOfMonth: true)
]

func startOfDay(_ date: Date) -> Date {
    Calendar.current.startOfDay(for: date)
}

func makeDate(year: Int, month: Int, day: Int) -> Date {
    Calendar.current.date(from: DateComponents(year: year, month: month, day: day)) ?? Date()
}

func period(for now: Date) -> BudgetPeriod {
    let cal = Calendar.current
    let c = cal.dateComponents([.year, .month, .day], from: now)
    let y = c.year!
    let m = c.month!
    let d = c.day!

    if d >= 7 && d < 17 {
        return BudgetPeriod(
            start: makeDate(year: y, month: m, day: 7),
            nextPayday: makeDate(year: y, month: m, day: 17),
            freeBudget: 17_000
        )
    }

    if d >= 17 && d < 22 {
        return BudgetPeriod(
            start: makeDate(year: y, month: m, day: 17),
            nextPayday: makeDate(year: y, month: m, day: 22),
            freeBudget: 14_000
        )
    }

    if d >= 22 {
        let next = cal.date(byAdding: .month, value: 1, to: makeDate(year: y, month: m, day: 7))!
        return BudgetPeriod(
            start: makeDate(year: y, month: m, day: 22),
            nextPayday: next,
            freeBudget: 28_500
        )
    }

    let prevMonth = cal.date(byAdding: .month, value: -1, to: now)!
    let pc = cal.dateComponents([.year, .month], from: prevMonth)
    return BudgetPeriod(
        start: makeDate(year: pc.year!, month: pc.month!, day: 22),
        nextPayday: makeDate(year: y, month: m, day: 7),
        freeBudget: 28_500
    )
}

func money(_ value: Double) -> String {
    let formatter = NumberFormatter()
    formatter.numberStyle = .decimal
    formatter.maximumFractionDigits = 0
    formatter.groupingSeparator = " "
    return (formatter.string(from: NSNumber(value: max(0, value))) ?? "0") + " ₽"
}

func dateShort(_ date: Date) -> String {
    let f = DateFormatter()
    f.locale = Locale(identifier: "ru_RU")
    f.dateFormat = "d MMMM"
    return f.string(from: date)
}

func dateFull(_ date: Date) -> String {
    let f = DateFormatter()
    f.locale = Locale(identifier: "ru_RU")
    f.dateFormat = "EEEE, d MMMM"
    return f.string(from: date)
}

func dayCaption(_ date: Date) -> String {
    let f = DateFormatter()
    f.locale = Locale(identifier: "ru_RU")
    f.dateFormat = "E, d MMM"
    return f.string(from: date)
}

extension Color {
    static let budgetBG = Color(red: 0.965, green: 0.972, blue: 0.988)
    static let budgetText = Color(red: 0.06, green: 0.09, blue: 0.17)
    static let budgetMuted = Color(red: 0.39, green: 0.46, blue: 0.57)
    static let budgetGreen = Color(red: 0.92, green: 0.99, blue: 0.96)
    static let budgetFood = Color(red: 1.0, green: 0.96, blue: 0.78)
    static let budgetFun = Color(red: 0.94, green: 0.92, blue: 1.0)
    static let budgetOther = Color(red: 0.88, green: 0.94, blue: 1.0)
}

struct CardModifier: ViewModifier {
    func body(content: Content) -> some View {
        content
            .padding(18)
            .background(Color.white)
            .clipShape(RoundedRectangle(cornerRadius: 24, style: .continuous))
            .overlay(RoundedRectangle(cornerRadius: 24, style: .continuous).stroke(Color.black.opacity(0.06)))
    }
}

extension View {
    func budgetCard() -> some View { modifier(CardModifier()) }
}

struct ContentView: View {
    @EnvironmentObject var store: BudgetStore
    @State private var showAdd = false

    private var now: Date { startOfDay(Date()) }
    private var current: BudgetPeriod { period(for: now) }

    private var periodExpenses: [Expense] {
        store.expenses.filter { $0.date >= current.start && $0.date < current.nextPayday }
    }

    private var periodSpent: Double {
        periodExpenses.reduce(0) { $0 + $1.amount }
    }

    private var remaining: Double {
        max(0, current.freeBudget - periodSpent)
    }

    private var daysLeft: Int {
        max(1, Calendar.current.dateComponents([.day], from: now, to: current.nextPayday).day ?? 1)
    }

    private var dailyLimit: Double {
        remaining / Double(daysLeft)
    }

    private var spentToday: Double {
        store.expenses.filter { Calendar.current.isDate($0.date, inSameDayAs: now) }.reduce(0) { $0 + $1.amount }
    }

    private func categorySpent(_ category: BudgetCategory) -> Double {
        let cal = Calendar.current
        return store.expenses.filter {
            $0.category == category &&
            cal.component(.year, from: $0.date) == cal.component(.year, from: now) &&
            cal.component(.month, from: $0.date) == cal.component(.month, from: now)
        }.reduce(0) { $0 + $1.amount }
    }

    private func nextBillDate(_ bill: Bill) -> Date {
        let cal = Calendar.current
        var comps = cal.dateComponents([.year, .month], from: now)
        let year = comps.year!
        let month = comps.month!

        func dateInMonth(year: Int, month: Int) -> Date {
            let base = makeDate(year: year, month: month, day: 1)
            let range = cal.range(of: .day, in: .month, for: base)!
            let day = bill.lastDayOfMonth ? range.count : min(bill.day, range.count)
            return makeDate(year: year, month: month, day: day)
        }

        let thisMonth = dateInMonth(year: year, month: month)
        if thisMonth >= now { return thisMonth }

        let nextMonth = cal.date(byAdding: .month, value: 1, to: makeDate(year: year, month: month, day: 1))!
        comps = cal.dateComponents([.year, .month], from: nextMonth)
        return dateInMonth(year: comps.year!, month: comps.month!)
    }

    private var upcomingBills: [(Bill, Date)] {
        bills
            .map { ($0, nextBillDate($0)) }
            .filter { $0.1 < current.nextPayday }
            .sorted { $0.1 < $1.1 }
    }

    var body: some View {
        NavigationStack {
            ScrollView {
                LazyVStack(spacing: 14) {
                    header
                    hero
                    metrics
                    forecast
                    categorySection
                    if !upcomingBills.isEmpty { billsSection }
                    historySection
                }
                .padding(.horizontal, 16)
                .padding(.bottom, 28)
            }
            .background(Color.budgetBG.ignoresSafeArea())
            .toolbar(.hidden, for: .navigationBar)
            .sheet(isPresented: $showAdd) {
                AddExpenseView()
                    .environmentObject(store)
            }
        }
        .preferredColorScheme(.light)
    }

    private var header: some View {
        HStack(alignment: .top) {
            VStack(alignment: .leading, spacing: 3) {
                Text("Мой бюджет")
                    .font(.system(size: 34, weight: .bold))
                    .foregroundStyle(Color.budgetText)
                Text(dateFull(now))
                    .font(.system(size: 16))
                    .foregroundStyle(Color.budgetMuted)
            }
            Spacer()
            Button {
                showAdd = true
            } label: {
                Label("расход", systemImage: "plus")
                    .font(.system(size: 17, weight: .semibold))
                    .foregroundStyle(Color.budgetText)
                    .padding(.horizontal, 16)
                    .padding(.vertical, 13)
                    .background(Color.white)
                    .clipShape(RoundedRectangle(cornerRadius: 18, style: .continuous))
                    .shadow(color: .black.opacity(0.05), radius: 5, y: 2)
            }
        }
        .padding(.top, 12)
    }

    private var hero: some View {
        VStack(alignment: .leading, spacing: 16) {
            Text("Период \(dateShort(current.start)) → \(dateShort(current.nextPayday))")
                .foregroundStyle(Color.budgetMuted)
                .font(.system(size: 15))

            HStack(alignment: .bottom) {
                VStack(alignment: .leading, spacing: 5) {
                    Text(money(remaining))
                        .font(.system(size: 46, weight: .bold))
                        .foregroundStyle(Color.budgetText)
                    Text("осталось до следующей выплаты")
                        .foregroundStyle(Color.budgetMuted)
                        .font(.system(size: 15))
                }
                Spacer()
                VStack(alignment: .trailing, spacing: 3) {
                    Text("Следующая выплата")
                        .foregroundStyle(Color.budgetMuted)
                        .font(.system(size: 13))
                    Text(dateShort(current.nextPayday))
                        .font(.system(size: 18, weight: .bold))
                        .foregroundStyle(Color.budgetText)
                }
            }

            ProgressView(value: min(1, periodSpent / current.freeBudget))
                .tint(Color.budgetText)
                .scaleEffect(x: 1, y: 1.8)

            Text(periodSpent <= current.freeBudget
                 ? "Темп в норме. Потрачено \(money(periodSpent)) из \(money(current.freeBudget)) свободного бюджета периода."
                 : "Есть перерасход относительно свободного бюджета периода.")
                .font(.system(size: 14))
                .foregroundStyle(Color(red: 0.03, green: 0.48, blue: 0.36))
                .padding(14)
                .frame(maxWidth: .infinity, alignment: .leading)
                .background(Color.budgetGreen)
                .clipShape(RoundedRectangle(cornerRadius: 18, style: .continuous))
        }
        .budgetCard()
    }

    private var metrics: some View {
        HStack(spacing: 12) {
            VStack(alignment: .leading, spacing: 8) {
                Text("Можно тратить сегодня")
                    .font(.system(size: 14))
                    .foregroundStyle(Color.budgetMuted)
                Text(money(dailyLimit))
                    .font(.system(size: 28, weight: .bold))
                Text("\(daysLeft) \(daysWord(daysLeft)) до выплаты")
                    .font(.system(size: 13))
                    .foregroundStyle(Color.budgetMuted)
            }
            .frame(maxWidth: .infinity, minHeight: 118, alignment: .topLeading)
            .budgetCard()

            VStack(alignment: .leading, spacing: 8) {
                Text("Потрачено сегодня")
                    .font(.system(size: 14))
                    .foregroundStyle(Color.budgetMuted)
                Text(money(spentToday))
                    .font(.system(size: 28, weight: .bold))
                Text(spentToday <= dailyLimit ? "в пределах лимита" : "выше дневного лимита")
                    .font(.system(size: 13))
                    .foregroundStyle(Color.budgetMuted)
            }
            .frame(maxWidth: .infinity, minHeight: 118, alignment: .topLeading)
            .budgetCard()
        }
    }

    private var forecast: some View {
        VStack(alignment: .leading, spacing: 14) {
            Text("До следующей выплаты")
                .font(.system(size: 22, weight: .bold))

            ScrollView(.horizontal, showsIndicators: false) {
                HStack(spacing: 10) {
                    ForEach(0..<min(daysLeft, 14), id: \.self) { offset in
                        let date = Calendar.current.date(byAdding: .day, value: offset, to: now)!
                        VStack(alignment: .leading, spacing: 5) {
                            Text(offset == 0 ? "Сегодня" : dayCaption(date))
                                .font(.system(size: 13))
                                .foregroundStyle(Color.budgetMuted)
                            Text(money(offset == 0 ? max(0, dailyLimit - spentToday) : dailyLimit))
                                .font(.system(size: 19, weight: .bold))
                            Text(offset == 0 ? "ещё сегодня" : "ориентир")
                                .font(.system(size: 12))
                                .foregroundStyle(Color.budgetMuted)
                        }
                        .padding(14)
                        .frame(width: 128, alignment: .leading)
                        .background(Color.white)
                        .clipShape(RoundedRectangle(cornerRadius: 18, style: .continuous))
                        .overlay(RoundedRectangle(cornerRadius: 18, style: .continuous).stroke(offset == 0 ? Color.gray.opacity(0.55) : Color.black.opacity(0.06)))
                    }
                }
            }
        }
        .budgetCard()
    }

    private var categorySection: some View {
        VStack(alignment: .leading, spacing: 14) {
            Text("Лимиты на месяц")
                .font(.system(size: 22, weight: .bold))

            ForEach(BudgetCategory.allCases) { category in
                let spent = categorySpent(category)
                let remain = max(0, category.limit - spent)

                VStack(alignment: .leading, spacing: 7) {
                    HStack {
                        Text(category.title)
                            .font(.system(size: 18, weight: .bold))
                        Spacer()
                        Text(money(remain))
                            .font(.system(size: 18, weight: .bold))
                    }
                    Text("потрачено \(money(spent)) из \(money(category.limit))")
                        .font(.system(size: 13))
                        .foregroundStyle(Color.budgetMuted)
                }
                .padding(16)
                .background(categoryColor(category))
                .clipShape(RoundedRectangle(cornerRadius: 20, style: .continuous))
            }
        }
        .budgetCard()
    }

    private var billsSection: some View {
        VStack(alignment: .leading, spacing: 12) {
            Text("Обязательные платежи до выплаты")
                .font(.system(size: 22, weight: .bold))

            ForEach(upcomingBills, id: \.0.id) { item in
                HStack {
                    VStack(alignment: .leading, spacing: 3) {
                        Text(item.0.title)
                            .font(.system(size: 16, weight: .semibold))
                        Text(dateShort(item.1))
                            .font(.system(size: 13))
                            .foregroundStyle(Color.budgetMuted)
                    }
                    Spacer()
                    Text(money(item.0.amount))
                        .font(.system(size: 16, weight: .bold))
                }
                if item.0.id != upcomingBills.last?.0.id {
                    Divider()
                }
            }
        }
        .budgetCard()
    }

    private var historySection: some View {
        VStack(alignment: .leading, spacing: 12) {
            HStack {
                Text("Последние расходы")
                    .font(.system(size: 22, weight: .bold))
                Spacer()
                Button("Добавить") { showAdd = true }
                    .font(.system(size: 14, weight: .semibold))
            }

            if store.expenses.isEmpty {
                Text("Расходов пока нет.")
                    .foregroundStyle(Color.budgetMuted)
                    .font(.system(size: 15))
                    .padding(.vertical, 8)
            } else {
                ForEach(store.expenses.sorted { $0.date > $1.date }.prefix(20)) { expense in
                    HStack {
                        VStack(alignment: .leading, spacing: 3) {
                            Text(expense.note.isEmpty ? expense.category.title : expense.note)
                                .font(.system(size: 16, weight: .semibold))
                            Text("\(dateShort(expense.date)) · \(expense.category.title)")
                                .font(.system(size: 13))
                                .foregroundStyle(Color.budgetMuted)
                        }
                        Spacer()
                        VStack(alignment: .trailing, spacing: 5) {
                            Text("−\(money(expense.amount))")
                                .font(.system(size: 16, weight: .bold))
                            Button("Удалить") { store.delete(expense) }
                                .font(.system(size: 12))
                                .foregroundStyle(.red)
                        }
                    }
                    .padding(.vertical, 5)
                    Divider()
                }
            }
        }
        .budgetCard()
    }

    private func categoryColor(_ c: BudgetCategory) -> Color {
        switch c {
        case .food: return .budgetFood
        case .fun: return .budgetFun
        case .other: return .budgetOther
        }
    }

    private func daysWord(_ n: Int) -> String {
        let n100 = n % 100
        let n10 = n % 10
        if n100 >= 11 && n100 <= 19 { return "дней" }
        if n10 == 1 { return "день" }
        if (2...4).contains(n10) { return "дня" }
        return "дней"
    }
}

struct AddExpenseView: View {
    @EnvironmentObject var store: BudgetStore
    @Environment(\.dismiss) private var dismiss

    @State private var amount = ""
    @State private var category: BudgetCategory = .food
    @State private var note = ""
    @State private var date = Date()

    var body: some View {
        NavigationStack {
            Form {
                Section("Расход") {
                    TextField("Сумма", text: $amount)
                        .keyboardType(.decimalPad)

                    Picker("Категория", selection: $category) {
                        ForEach(BudgetCategory.allCases) { category in
                            Text(category.title).tag(category)
                        }
                    }

                    TextField("Комментарий", text: $note)
                    DatePicker("Дата", selection: $date, displayedComponents: .date)
                }
            }
            .navigationTitle("Добавить расход")
            .navigationBarTitleDisplayMode(.inline)
            .toolbar {
                ToolbarItem(placement: .cancellationAction) {
                    Button("Отмена") { dismiss() }
                }
                ToolbarItem(placement: .confirmationAction) {
                    Button("Сохранить") {
                        let normalized = amount.replacingOccurrences(of: ",", with: ".")
                        if let value = Double(normalized), value > 0 {
                            store.add(amount: value, category: category, note: note.trimmingCharacters(in: .whitespacesAndNewlines), date: startOfDay(date))
                            dismiss()
                        }
                    }
                    .disabled(Double(amount.replacingOccurrences(of: ",", with: ".")) == nil)
                }
            }
        }
    }
}

@main
struct BudgetManagerApp: App {
    @StateObject private var store = BudgetStore()

    var body: some Scene {
        WindowGroup {
            ContentView()
                .environmentObject(store)
        }
    }
}

SWIFT

          cd BudgetManager
          xcodegen generate

      - name: Build unsigned app
        run: |
          cd BudgetManager
          xcodebuild \
            -project BudgetManager.xcodeproj \
            -scheme BudgetManager \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          cd BudgetManager
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/BudgetManager.app Payload/
          zip -qry BudgetManager-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BudgetManager-unsigned
          path: BudgetManager/BudgetManager-unsigned.ipa
          retention-days: 7

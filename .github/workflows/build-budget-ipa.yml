                              .padding(.vertical, 5)
                              Divider()
                          }
                      }
                  }
                  .budgetCard()
              }
          
              private func categoryColor(_ c: BudgetCategory) -> Color {
                  switch c {
                  case .food: return .budgetFood
                  case .fun: return .budgetFun
                  case .other: return .budgetOther
                  case .rent, .gptSubscription, .mobile, .internet:
                      return Color(red: 0.94, green: 0.95, blue: 0.97)
                  }
              }
          
              private func daysWord(_ n: Int) -> String {
                  let n100 = n % 100
                  let n10 = n % 10
                  if n100 >= 11 && n100 <= 19 { return "дней" }
                  if n10 == 1 { return "день" }
                  if (2...4).contains(n10) { return "дня" }
                  return "дней"
              }
          }
          

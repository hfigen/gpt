                              VStack(alignment: .leading, spacing: 8) {
                                  Text("В этом месяце")
                                      .font(.system(size: 14))
                                      .foregroundStyle(Color.lizaMuted)
                                  Text(money(monthTotal))
                                      .font(.system(size: 42, weight: .bold))
                                  Text("Пока без планового лимита накоплений.")
                                      .font(.system(size: 12))
                                      .foregroundStyle(Color.lizaMuted)
                              }
                              .frame(maxWidth: .infinity, alignment: .leading)
                              .card()
          
                              HStack(spacing: 12) {
                                  VStack(alignment: .leading, spacing: 5) {
                                      HStack {
                                          Text("Всего накоплено")
                                              .font(.system(size: 13))
                                              .foregroundStyle(Color.lizaMuted)
                                          Spacer()
                                          Button("Сбросить") {
                                              resetConfirm = true
                                          }
                                          .font(.system(size: 11, weight: .semibold))

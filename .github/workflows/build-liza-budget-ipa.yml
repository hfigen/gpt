          // MARK: - Analytics
          
          struct AnalyticsView: View {
              @EnvironmentObject var store: LizaBudgetStore
              @State private var selectedMonth = monthStart(Date())
          
              private var interval: DateInterval {
                  Calendar.current.dateInterval(of: .month, for: selectedMonth)!
              }
          
              private var livingExpenses: [Expense] {
                  store.expenses.filter { interval.contains($0.date) }
              }
          
              private var fixed: [FixedBillOccurrence] {
                  fixedBills(in: selectedMonth)
              }
          
              private var cards: [CreditCardPayment] {
                  store.cardPayments.filter { interval.contains($0.dueDate) }
              }
          
              private var savings: [SavingEntry] {
                  store.savings.filter { interval.contains($0.date) }
              }
          
              private var payEvents: [PaydayEvent] {
                  paydayEvents(around: selectedMonth).filter { interval.contains($0.actualDate) }
              }
          
              private var incomeTotal: Double {
                  payEvents.reduce(0) { $0 + store.income(for: $1) }
              }
          
              private var livingTotal: Double {
                  livingExpenses.reduce(0) { $0 + $1.amount }
              }
          
              private var fixedTotal: Double {
                  fixed.reduce(0) { $0 + $1.amount }
              }
          
              private var cardsTotal: Double {
                  cards.reduce(0) { $0 + $1.amount }
              }
          
              private var savingsTotal: Double {
                  savings.reduce(0) { $0 + $1.amount }
              }
          
              private var outflowTotal: Double {
                  livingTotal + fixedTotal + cardsTotal
              }
          
              private var balance: Double {
                  incomeTotal - outflowTotal - savingsTotal
              }
          
              private var dailyPoints: [DailyPoint] {
                  let cal = Calendar.current
                  let days = daysInMonth(selectedMonth)
                  return (1...days).map { day in
                      let c = cal.dateComponents([.year, .month], from: selectedMonth)
                      let date = makeDate(year: c.year!, month: c.month!, day: day)
          
                      let living = livingExpenses.filter { cal.isDate($0.date, inSameDayAs: date) }
                          .reduce(0) { $0 + $1.amount }
                      let fixedValue = fixed.filter { cal.isDate($0.dueDate, inSameDayAs: date) }
                          .reduce(0) { $0 + $1.amount }
                      let cardValue = cards.filter { cal.isDate($0.dueDate, inSameDayAs: date) }
                          .reduce(0) { $0 + $1.amount }
          
                      return DailyPoint(date: date, amount: living + fixedValue + cardValue)
                  }
              }
          
              private func csvField(_ value: String) -> String {
                  let quote = String(UnicodeScalar(34)!)
                  let escaped = value.replacingOccurrences(of: quote, with: quote + quote)
                  return quote + escaped + quote
              }
          
              private var exportURL: URL {
                  let f = DateFormatter()
                  f.locale = Locale(identifier: "en_US_POSIX")
                  f.dateFormat = "yyyy-MM"
                  let url = FileManager.default.temporaryDirectory
                      .appendingPathComponent("rashody_liza_\(f.string(from: selectedMonth)).csv")
          
                  let dateF = DateFormatter()
                  dateF.dateFormat = "dd.MM.yyyy"
          
                  var rows = ["Дата;Тип;Категория;Комментарий;Сумма"]
          
                  for item in livingExpenses.sorted(by: { $0.date < $1.date }) {
                      rows.append([
                          csvField(dateF.string(from: item.date)),
                          csvField("Повседневный расход"),
                          csvField(item.category.title),
                          csvField(item.note),
                          csvField(String(format: "%.2f", item.amount).replacingOccurrences(of: ".", with: ","))
                      ].joined(separator: ";"))
                  }
          
                  for item in fixed.sorted(by: { $0.dueDate < $1.dueDate }) {
                      rows.append([
                          csvField(dateF.string(from: item.dueDate)),
                          csvField("Обязательный платёж"),
                          csvField(item.title),
                          csvField(item.detail),
                          csvField(String(format: "%.2f", item.amount).replacingOccurrences(of: ".", with: ","))
                      ].joined(separator: ";"))
                  }
          
                  for item in cards.sorted(by: { $0.dueDate < $1.dueDate }) {
                      rows.append([
                          csvField(dateF.string(from: item.dueDate)),
                          csvField("Кредитка"),
                          csvField(item.issuer.title),
                          csvField("Платёж по кредитной карте"),
                          csvField(String(format: "%.2f", item.amount).replacingOccurrences(of: ".", with: ","))
                      ].joined(separator: ";"))
                  }
          
                  let csv = "\u{FEFF}" + rows.joined(separator: "\n")
                  try? csv.data(using: .utf8)?.write(to: url, options: .atomic)
                  return url
              }
          
              var body: some View {
                  NavigationStack {
                      ScrollView {
                          LazyVStack(spacing: 14) {
                              HStack {
                                  VStack(alignment: .leading, spacing: 3) {
                                      Text("Аналитика")

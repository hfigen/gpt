                                  }
                                  .frame(height: 230)
                              }
                              .card()
          
                              VStack(alignment: .leading, spacing: 14) {
                                  Text("Баланс месяца")
                                      .font(.system(size: 22, weight: .bold))
          
                                  Chart {
                                      BarMark(x: .value("Показатель", "Доходы"), y: .value("Сумма", incomeTotal))
                                      BarMark(x: .value("Показатель", "Расходы"), y: .value("Сумма", outflowTotal))
                                      BarMark(x: .value("Показатель", "Накопления"), y: .value("Сумма", savingsTotal))
                                  }
                                  .frame(height: 190)
          
                                  HStack {
                                      Text("Остаток")
                                          .foregroundStyle(Color.lizaMuted)
                                      Spacer()
                                      Text(money(balance))
                                          .fontWeight(.bold)
                                          .foregroundStyle(balance >= 0 ? Color.lizaText : Color.red)
                                  }
                              }
                              .card()
          
                              HStack(spacing: 12) {
                                  metricCard("Доход", incomeTotal)
                                  metricCard("Повседневные", livingTotal)
                              }
          
                              HStack(spacing: 12) {
                                  metricCard("Обязательные", fixedTotal + cardsTotal)
                                  metricCard("Накопления", savingsTotal)
                              }
          
                              VStack(alignment: .leading, spacing: 12) {
                                  Text("Повседневные категории")
                                      .font(.system(size: 22, weight: .bold))
          
                                  ForEach(LivingCategory.allCases) { category in
                                      let value = livingExpenses.filter { $0.category == category }
                                          .reduce(0) { $0 + $1.amount }
          

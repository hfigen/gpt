                                  .font(.system(size: 12))
                                  .foregroundStyle(Color.lizaAccent)
                          } else {
                              Text("Рассчитано по производственному календарю и рабочим дням.")
                                  .font(.system(size: 12))
                                  .foregroundStyle(Color.lizaMuted)
                          }
                      }
                      .card()
                  }
              }
          
              private var obligations: some View {
                  VStack(alignment: .leading, spacing: 14) {
                      HStack {
                          Text("Обязательные платежи")
                              .font(.system(size: 22, weight: .bold))
                          Spacer()
                          Text(money(fixedReserve + cardReserve))

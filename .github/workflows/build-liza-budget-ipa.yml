              @State private var showAdd = false
              @State private var editing: SavingEntry?
              @State private var resetConfirm = false
          
              private var now: Date { startOfDay(Date()) }
              private var currentMonth: DateInterval {
                  Calendar.current.dateInterval(of: .month, for: now)!
              }
          
              private var monthTotal: Double {
                  store.savings.filter { currentMonth.contains($0.date) }.reduce(0) { $0 + $1.amount }
              }
          
              private var lifetimeTotal: Double {
                  store.savings.reduce(0) { $0 + $1.amount }
              }
          
              private var trackedTotal: Double {
                  max(0, lifetimeTotal - store.savingsTrackingBaseline)
              }
          
              private var trackingDays: Int {
                  let value = Calendar.current.dateComponents(
                      [.day],
                      from: startOfDay(store.savingsTrackingStart),
                      to: now
                  ).day ?? 0
                  return max(1, value + 1)
              }
          
              var body: some View {

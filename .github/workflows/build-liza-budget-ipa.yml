          // MARK: - Main budget
          
          struct BudgetView: View {
              @EnvironmentObject var store: LizaBudgetStore
          
              @State private var showExpenseAdd = false
              @State private var editingExpense: Expense?
              @State private var showIncome = false
              @State private var showCards = false
          
              private var now: Date { startOfDay(Date()) }
              private var period: PayPeriod { currentPayPeriod(now) }
          
              private var periodIncome: Double {
                  store.income(for: period.current)
              }
          
              private var periodFixedBills: [FixedBillOccurrence] {
                  fixedBills(for: period.current)
              }
          
              private var fixedReserve: Double {
                  periodFixedBills.reduce(0) { $0 + $1.amount }
              }
          
              private var periodCardPayments: [CreditCardPayment] {
                  store.cardPayments.filter {
                      $0.dueDate >= period.current.actualDate &&
                      $0.dueDate < period.next.actualDate
                  }
              }
          
              private var cardReserve: Double {
                  periodCardPayments.reduce(0) { $0 + $1.amount }
              }
          
              private var periodExpenses: [Expense] {
                  store.expenses.filter {
                      $0.date >= period.current.actualDate &&
                      $0.date < period.next.actualDate
                  }
              }
          
              private var spent: Double {
                  periodExpenses.reduce(0) { $0 + $1.amount }
              }
          
              private var periodSavings: Double {
                  store.savings.filter {
                      $0.date >= period.current.actualDate &&
                      $0.date < period.next.actualDate
                  }.reduce(0) { $0 + $1.amount }
              }
          
              private var remaining: Double {
                  periodIncome - fixedReserve - cardReserve - spent - periodSavings
              }
          
              private var daysLeft: Int {
                  max(1, Calendar.current.dateComponents([.day], from: now, to: period.next.actualDate).day ?? 1)
              }
          
              private var dailyBudget: Double {
                  remaining / Double(daysLeft)
              }
          
              private var spentToday: Double {
                  store.expenses.filter { Calendar.current.isDate($0.date, inSameDayAs: now) }
                      .reduce(0) { $0 + $1.amount }
              }
          
              private func spentInPeriod(_ category: LivingCategory) -> Double {
                  periodExpenses.filter { $0.category == category }.reduce(0) { $0 + $1.amount }
              }
          

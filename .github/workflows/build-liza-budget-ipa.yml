                              .background(Color.lizaSoft.opacity(0.7))
                              .clipShape(RoundedRectangle(cornerRadius: 15, style: .continuous))
                      }
                  }
                  .card()
              }
          
              private var metrics: some View {
                  VStack(spacing: 12) {
                      HStack(spacing: 12) {
                          VStack(alignment: .leading, spacing: 7) {
                              Text("Бюджет на день")
                                  .font(.system(size: 13))
                                  .foregroundStyle(Color.lizaMuted)

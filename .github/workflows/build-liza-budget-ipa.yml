name: Build Liza Budget IPA

on:
  push:
    paths:
      - '.github/workflows/build-liza-budget-ipa.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create project
        run: |
          mkdir -p LizaBudget/App LizaBudget/Resources

          cat > LizaBudget/project.yml <<'EOF'
          name: LizaBudget
          options:
            deploymentTarget:
              iOS: "17.0"
          targets:
            LizaBudget:
              type: application
              platform: iOS
              sources:
                - path: App
              resources:
                - path: Resources
              settings:
                base:
                  PRODUCT_BUNDLE_IDENTIFIER: com.hfigen.lizabudget
                  PRODUCT_NAME: LizaBudget
                  PRODUCT_MODULE_NAME: LizaBudget
                  CURRENT_PROJECT_VERSION: 1
                  MARKETING_VERSION: 1.0.0
                  GENERATE_INFOPLIST_FILE: NO
                  INFOPLIST_FILE: App/Info.plist
                  TARGETED_DEVICE_FAMILY: "1"
                  SWIFT_VERSION: "5.0"
                  IPHONEOS_DEPLOYMENT_TARGET: "17.0"
          EOF

          cat > LizaBudget/App/Info.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>
              <string>$(DEVELOPMENT_LANGUAGE)</string>
              <key>CFBundleDisplayName</key>
              <string>Бюджет Лизы</string>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleInfoDictionaryVersion</key>
              <string>6.0</string>
              <key>CFBundleName</key>
              <string>$(PRODUCT_NAME)</string>
              <key>CFBundlePackageType</key>
              <string>$(PRODUCT_BUNDLE_PACKAGE_TYPE)</string>
              <key>CFBundleShortVersionString</key>
              <string>$(MARKETING_VERSION)</string>
              <key>CFBundleVersion</key>
              <string>$(CURRENT_PROJECT_VERSION)</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
              <key>UIRequiresFullScreen</key>
              <true/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          PLIST

          cat > LizaBudget/Resources/LaunchScreen.storyboard <<'STORYBOARD'
          <?xml version="1.0" encoding="UTF-8"?>
          <document type="com.apple.InterfaceBuilder3.CocoaTouch.Storyboard.XIB" version="3.0" toolsVersion="23096" targetRuntime="iOS.CocoaTouch" propertyAccessControl="none" useAutolayout="YES" launchScreen="YES" colorMatched="YES" initialViewController="01J-lp-oVM">
              <device id="retina6_12" orientation="portrait" appearance="light"/>
              <dependencies>
                  <plugIn identifier="com.apple.InterfaceBuilder.IBCocoaTouchPlugin" version="23084"/>
                  <capability name="Safe area layout guides" minToolsVersion="9.0"/>
                  <capability name="documents saved in the Xcode 8 format" minToolsVersion="8.0"/>
              </dependencies>
              <scenes>
                  <scene sceneID="EHf-IW-A2E">
                      <objects>
                          <viewController id="01J-lp-oVM" sceneMemberID="viewController">
                              <view key="view" contentMode="scaleToFill" id="Ze5-6b-2t3">
                                  <rect key="frame" x="0.0" y="0.0" width="393" height="852"/>
                                  <autoresizingMask key="autoresizingMask" widthSizable="YES" heightSizable="YES"/>
                                  <viewLayoutGuide key="safeArea" id="Bcu-3y-fUS"/>
                                  <color key="backgroundColor" red="0.978" green="0.964" blue="0.985" alpha="1" colorSpace="custom" customColorSpace="sRGB"/>
                              </view>
                          </viewController>
                          <placeholder placeholderIdentifier="IBFirstResponder" id="iYj-Kq-Ea1" userLabel="First Responder" sceneMemberID="firstResponder"/>
                      </objects>
                  </scene>
              </scenes>
          </document>
          STORYBOARD

          cat > LizaBudget/App/LizaBudgetApp.swift <<'SWIFT'
          import SwiftUI
          import Charts
          
          // MARK: - Models
          
          enum LivingCategory: String, Codable, CaseIterable, Identifiable {
              case food, cafe, beauty, fun, clothes, other
          
              var id: String { rawValue }
          
              var title: String {
                  switch self {
                  case .food: return "Еда"
                  case .cafe: return "Кафе"
                  case .beauty: return "Красота"
                  case .fun: return "Развлечения"
                  case .clothes: return "Одежда"
                  case .other: return "Прочее"
                  }
              }
          
              var systemImage: String {
                  switch self {
                  case .food: return "cart"
                  case .cafe: return "cup.and.saucer"
                  case .beauty: return "sparkles"
                  case .fun: return "party.popper"
                  case .clothes: return "tshirt"
                  case .other: return "ellipsis.circle"
                  }
              }
          }
          
          enum CreditCardIssuer: String, Codable, CaseIterable, Identifiable {
              case yandex, sber, tinkoff
              var id: String { rawValue }
          
              var title: String {
                  switch self {
                  case .yandex: return "Яндекс"
                  case .sber: return "Сбер"
                  case .tinkoff: return "Тинькофф"
                  }
              }
          }
          
          struct Expense: Identifiable, Codable {
              var id = UUID()
              var amount: Double
              var category: LivingCategory
              var note: String
              var date: Date
          }
          
          struct SavingEntry: Identifiable, Codable {
              var id = UUID()
              var amount: Double
              var note: String
              var date: Date
          }
          
          struct CreditCardPayment: Identifiable, Codable {
              var id = UUID()
              var issuer: CreditCardIssuer
              var amount: Double
              var dueDate: Date
          }
          
          struct FixedBillOccurrence: Identifiable {
              let id = UUID()
              let title: String
              let amount: Double
              let dueDate: Date
              let detail: String
          }
          
          struct PaydayEvent: Identifiable {
              let id: String
              let actualDate: Date
              let nominalDay: Int
              let payMonthStart: Date
              let expectedAmount: Double
              let workPeriodText: String
          }
          
          struct PayPeriod {
              let current: PaydayEvent
              let next: PaydayEvent
          }
          
          struct DailyPoint: Identifiable {
              let id = UUID()
              let date: Date
              let amount: Double
          }
          
          // MARK: - Store
          
          final class LizaBudgetStore: ObservableObject {
              @Published var expenses: [Expense] = [] { didSet { saveExpenses() } }
              @Published var savings: [SavingEntry] = [] { didSet { saveSavings() } }
              @Published var cardPayments: [CreditCardPayment] = [] { didSet { saveCards() } }
              @Published var incomeOverrides: [String: Double] = [:] { didSet { saveIncomeOverrides() } }
          
              @Published var savingsTrackingStart: Date = Calendar.current.startOfDay(for: Date()) {
                  didSet { saveSavingsTracking() }
              }
              @Published var savingsTrackingBaseline: Double = 0 {
                  didSet { saveSavingsTracking() }
              }
          
              private let expensesKey = "liza_expenses_v1"
              private let savingsKey = "liza_savings_v1"
              private let cardsKey = "liza_cards_v1"
              private let incomeKey = "liza_income_overrides_v1"
              private let trackStartKey = "liza_savings_tracking_start_v1"
              private let trackBaselineKey = "liza_savings_tracking_baseline_v1"
          
              init() {
                  let decoder = JSONDecoder()
                  decoder.dateDecodingStrategy = .iso8601
          
                  if let data = UserDefaults.standard.data(forKey: expensesKey),
                     let value = try? decoder.decode([Expense].self, from: data) {
                      expenses = value
                  }
                  if let data = UserDefaults.standard.data(forKey: savingsKey),
                     let value = try? decoder.decode([SavingEntry].self, from: data) {
                      savings = value
                  }
                  if let data = UserDefaults.standard.data(forKey: cardsKey),
                     let value = try? decoder.decode([CreditCardPayment].self, from: data) {
                      cardPayments = value
                  }
                  if let data = UserDefaults.standard.data(forKey: incomeKey),
                     let value = try? decoder.decode([String: Double].self, from: data) {
                      incomeOverrides = value
                  }
          
                  if let date = UserDefaults.standard.object(forKey: trackStartKey) as? Date {
                      savingsTrackingStart = date
                  } else if let earliest = savings.map({ $0.date }).min() {
                      savingsTrackingStart = earliest
                  }
          
                  if UserDefaults.standard.object(forKey: trackBaselineKey) != nil {
                      savingsTrackingBaseline = UserDefaults.standard.double(forKey: trackBaselineKey)
                  }
              }
          
              private func encode<T: Encodable>(_ value: T, key: String) {
                  let encoder = JSONEncoder()
                  encoder.dateEncodingStrategy = .iso8601
                  if let data = try? encoder.encode(value) {
                      UserDefaults.standard.set(data, forKey: key)
                  }
              }
          
              private func saveExpenses() { encode(expenses, key: expensesKey) }
              private func saveSavings() { encode(savings, key: savingsKey) }
              private func saveCards() { encode(cardPayments, key: cardsKey) }
              private func saveIncomeOverrides() { encode(incomeOverrides, key: incomeKey) }
          
              private func saveSavingsTracking() {
                  UserDefaults.standard.set(savingsTrackingStart, forKey: trackStartKey)
                  UserDefaults.standard.set(savingsTrackingBaseline, forKey: trackBaselineKey)
              }
          
              func addExpense(amount: Double, category: LivingCategory, note: String, date: Date) {
                  expenses.append(Expense(amount: amount, category: category, note: note, date: startOfDay(date)))
              }
          
              func updateExpense(_ expense: Expense, amount: Double, category: LivingCategory, note: String, date: Date) {
                  guard let i = expenses.firstIndex(where: { $0.id == expense.id }) else { return }
                  expenses[i] = Expense(id: expense.id, amount: amount, category: category, note: note, date: startOfDay(date))
              }
          
              func deleteExpense(_ expense: Expense) {
                  expenses.removeAll { $0.id == expense.id }
              }
          
              func addSaving(amount: Double, note: String, date: Date) {
                  savings.append(SavingEntry(amount: amount, note: note, date: startOfDay(date)))
              }
          
              func updateSaving(_ entry: SavingEntry, amount: Double, note: String, date: Date) {
                  guard let i = savings.firstIndex(where: { $0.id == entry.id }) else { return }
                  savings[i] = SavingEntry(id: entry.id, amount: amount, note: note, date: startOfDay(date))
              }
          
              func deleteSaving(_ entry: SavingEntry) {
                  savings.removeAll { $0.id == entry.id }
              }
          
              func resetSavingsCounter() {
                  savingsTrackingBaseline = savings.reduce(0) { $0 + $1.amount }
                  savingsTrackingStart = startOfDay(Date())
              }
          
              func addCardPayment(issuer: CreditCardIssuer, amount: Double, dueDate: Date) {
                  cardPayments.append(CreditCardPayment(issuer: issuer, amount: amount, dueDate: startOfDay(dueDate)))
              }
          
              func updateCardPayment(_ payment: CreditCardPayment, issuer: CreditCardIssuer, amount: Double, dueDate: Date) {
                  guard let i = cardPayments.firstIndex(where: { $0.id == payment.id }) else { return }
                  cardPayments[i] = CreditCardPayment(id: payment.id, issuer: issuer, amount: amount, dueDate: startOfDay(dueDate))
              }
          
              func deleteCardPayment(_ payment: CreditCardPayment) {
                  cardPayments.removeAll { $0.id == payment.id }
              }
          
              func setIncome(event: PaydayEvent, amount: Double) {
                  incomeOverrides[event.id] = amount
              }
          
              func clearIncomeOverride(event: PaydayEvent) {
                  incomeOverrides.removeValue(forKey: event.id)
              }
          
              func income(for event: PaydayEvent) -> Double {
                  incomeOverrides[event.id] ?? event.expectedAmount
              }
          }
          
          // MARK: - Calendar and salary
          
          let monthlySalary: Double = 113_100
          
          func startOfDay(_ date: Date) -> Date {
              Calendar.current.startOfDay(for: date)
          }
          
          func makeDate(year: Int, month: Int, day: Int) -> Date {
              Calendar.current.date(from: DateComponents(year: year, month: month, day: day)) ?? Date()
          }
          
          func monthStart(_ date: Date) -> Date {
              let c = Calendar.current.dateComponents([.year, .month], from: date)
              return makeDate(year: c.year!, month: c.month!, day: 1)
          }
          
          func dateKey(_ date: Date) -> String {
              let f = DateFormatter()
              f.locale = Locale(identifier: "en_US_POSIX")
              f.dateFormat = "yyyy-MM-dd"
              return f.string(from: date)
          }
          
          // Approved Russian production calendars used by the app.
          // 2026: Government Resolution No. 1466 of 24.09.2025.
          // 2027: Government Resolution No. 1187 of 17.09.2026.
          private let forcedNonWorking: Set<String> = [
              // 2026 weekdays made non-working
              "2026-01-01","2026-01-02","2026-01-05","2026-01-06","2026-01-07","2026-01-08","2026-01-09",
              "2026-02-23","2026-03-09","2026-05-01","2026-05-11","2026-06-12","2026-11-04","2026-12-31",
          
              // 2027 weekdays made non-working
              "2027-01-01","2027-01-04","2027-01-05","2027-01-06","2027-01-07","2027-01-08",
              "2027-02-22","2027-02-23","2027-03-08","2027-05-03","2027-05-10","2027-06-14",
              "2027-11-04","2027-11-05","2027-12-31"
          ]
          
          private let forcedWorking: Set<String> = [
              "2027-02-20"
          ]
          
          func isWorkingDay(_ date: Date) -> Bool {
              let key = dateKey(date)
              if forcedWorking.contains(key) { return true }
              if forcedNonWorking.contains(key) { return false }
          
              let weekday = Calendar.current.component(.weekday, from: date)
              return weekday != 1 && weekday != 7
          }
          
          func daysInMonth(_ month: Date) -> Int {
              Calendar.current.range(of: .day, in: .month, for: month)?.count ?? 30
          }
          
          func workingDays(in month: Date, from startDay: Int? = nil, through endDay: Int? = nil) -> Int {
              let c = Calendar.current.dateComponents([.year, .month], from: month)
              let maxDay = daysInMonth(month)
              let first = max(1, startDay ?? 1)
              let last = min(maxDay, endDay ?? maxDay)
          
              guard first <= last else { return 0 }
          
              return (first...last).reduce(0) { count, day in
                  let d = makeDate(year: c.year!, month: c.month!, day: day)
                  return count + (isWorkingDay(d) ? 1 : 0)
              }
          }
          
          func adjustedPayday(year: Int, month: Int, nominalDay: Int) -> Date {
              let date = startOfDay(makeDate(year: year, month: month, day: nominalDay))
              let weekday = Calendar.current.component(.weekday, from: date)
          
              if weekday == 7 {
                  return Calendar.current.date(byAdding: .day, value: -1, to: date) ?? date
              }
              if weekday == 1 {
                  return Calendar.current.date(byAdding: .day, value: -2, to: date) ?? date
              }
              return date
          }
          
          func expectedPay(nominalDay: Int, payMonth: Date) -> (amount: Double, text: String) {
              let cal = Calendar.current
              let referenceMonth: Date
              let fromDay: Int
              let throughDay: Int
          
              if nominalDay == 20 {
                  referenceMonth = payMonth
                  fromDay = 1
                  throughDay = 15
              } else {
                  referenceMonth = cal.date(byAdding: .month, value: -1, to: payMonth) ?? payMonth
                  fromDay = 16
                  throughDay = daysInMonth(referenceMonth)
              }
          
              let total = workingDays(in: referenceMonth)
              let segment = workingDays(in: referenceMonth, from: fromDay, through: throughDay)
          
              guard total > 0 else { return (0, "") }
          
              let amount = (monthlySalary / Double(total) * Double(segment)).rounded()
              let f = DateFormatter()
              f.locale = Locale(identifier: "ru_RU")
              f.dateFormat = "LLLL yyyy"
          
              let text = "\(fromDay)–\(throughDay) \(f.string(from: referenceMonth)) · \(segment) раб. дн. из \(total)"
              return (amount, text)
          }
          
          func paydayEvents(around date: Date) -> [PaydayEvent] {
              let cal = Calendar.current
              let base = monthStart(date)
              var events: [PaydayEvent] = []
          
              for offset in -4...4 {
                  guard let payMonth = cal.date(byAdding: .month, value: offset, to: base) else { continue }
                  let c = cal.dateComponents([.year, .month], from: payMonth)
                  guard let y = c.year, let m = c.month else { continue }
          
                  for nominal in [5, 20] {
                      let actual = adjustedPayday(year: y, month: m, nominalDay: nominal)
                      let calc = expectedPay(nominalDay: nominal, payMonth: payMonth)
                      events.append(
                          PaydayEvent(
                              id: "\(dateKey(actual))_\(nominal)",
                              actualDate: actual,
                              nominalDay: nominal,
                              payMonthStart: payMonth,
                              expectedAmount: calc.amount,
                              workPeriodText: calc.text
                          )
                      )
                  }
              }
          
              return events.sorted { $0.actualDate < $1.actualDate }
          }
          
          func currentPayPeriod(_ date: Date) -> PayPeriod {
              let today = startOfDay(date)
              let events = paydayEvents(around: today)
              let index = events.lastIndex(where: { $0.actualDate <= today }) ?? 0
              return PayPeriod(
                  current: events[index],
                  next: events[min(index + 1, events.count - 1)]
              )
          }
          
          func fixedBills(for event: PaydayEvent) -> [FixedBillOccurrence] {
              let c = Calendar.current.dateComponents([.year, .month], from: event.payMonthStart)
              let y = c.year!
              let m = c.month!
          
              if event.nominalDay == 5 {
                  return [
                      FixedBillOccurrence(
                          title: "Тинькофф подписка",
                          amount: 3_000,
                          dueDate: event.actualDate,
                          detail: "Резерв после первой выплаты"
                      ),
                      FixedBillOccurrence(
                          title: "Кредит Сбербанк",
                          amount: 5_200,
                          dueDate: makeDate(year: y, month: m, day: 6),
                          detail: "6-го числа"
                      ),
                      FixedBillOccurrence(
                          title: "Мобильная связь",
                          amount: 1_000,
                          dueDate: makeDate(year: y, month: m, day: 14),
                          detail: "14-го числа"
                      )
                  ]
              } else {
                  let day30 = min(30, daysInMonth(event.payMonthStart))
                  return [
                      FixedBillOccurrence(
                          title: "Проезд",
                          amount: 3_400,
                          dueDate: event.actualDate,
                          detail: "Резерв после второй выплаты"
                      ),
                      FixedBillOccurrence(
                          title: "Подписки",
                          amount: 300,
                          dueDate: event.actualDate,
                          detail: "Резерв после второй выплаты"
                      ),
                      FixedBillOccurrence(
                          title: "Образовательный кредит",
                          amount: 3_500,
                          dueDate: makeDate(year: y, month: m, day: day30),
                          detail: day30 == 30 ? "30-го числа" : "В последний день месяца"
                      )
                  ]
              }
          }
          
          func fixedBills(in month: Date) -> [FixedBillOccurrence] {
              let interval = Calendar.current.dateInterval(of: .month, for: month)!
              let events = paydayEvents(around: month)
                  .filter { interval.contains($0.actualDate) }
              return events.flatMap { fixedBills(for: $0) }
                  .filter { interval.contains($0.dueDate) }
          }
          
          func money(_ value: Double) -> String {
              let formatter = NumberFormatter()
              formatter.numberStyle = .decimal
              formatter.maximumFractionDigits = 0
              formatter.groupingSeparator = "\u{202F}"
              let number = formatter.string(from: NSNumber(value: value)) ?? "0"
              return number + "\u{00A0}₽"
          }
          
          func dateShort(_ date: Date) -> String {
              let f = DateFormatter()
              f.locale = Locale(identifier: "ru_RU")
              f.dateFormat = "d MMMM"
              return f.string(from: date)
          }
          
          func monthTitle(_ date: Date) -> String {
              let f = DateFormatter()
              f.locale = Locale(identifier: "ru_RU")
              f.dateFormat = "LLLL yyyy"
              return f.string(from: date).capitalized
          }
          
          func dateFull(_ date: Date) -> String {
              let f = DateFormatter()
              f.locale = Locale(identifier: "ru_RU")
              f.dateFormat = "EEEE, d MMMM"
              return f.string(from: date)
          }
          
          func daysWord(_ n: Int) -> String {
              let n100 = n % 100
              let n10 = n % 10
              if n100 >= 11 && n100 <= 19 { return "дней" }
              if n10 == 1 { return "день" }
              if (2...4).contains(n10) { return "дня" }
              return "дней"
          }
          
          // MARK: - Style
          
          extension Color {
              static let lizaBG = Color(red: 0.978, green: 0.964, blue: 0.985)
              static let lizaText = Color(red: 0.16, green: 0.10, blue: 0.20)
              static let lizaMuted = Color(red: 0.43, green: 0.38, blue: 0.48)
              static let lizaAccent = Color(red: 0.57, green: 0.31, blue: 0.67)
              static let lizaSoft = Color(red: 0.95, green: 0.89, blue: 0.97)
              static let lizaGreen = Color(red: 0.91, green: 0.98, blue: 0.94)
              static let lizaWarning = Color(red: 1.0, green: 0.95, blue: 0.84)
          }
          
          struct CardModifier: ViewModifier {
              func body(content: Content) -> some View {
                  content
                      .padding(18)
                      .background(Color.white)
                      .clipShape(RoundedRectangle(cornerRadius: 24, style: .continuous))
                      .overlay(
                          RoundedRectangle(cornerRadius: 24, style: .continuous)
                              .stroke(Color.black.opacity(0.05))
                      )
              }
          }
          
          extension View {
              func card() -> some View { modifier(CardModifier()) }
          }
          
          // MARK: - Expense editor
          
          struct ExpenseEditorView: View {
              @EnvironmentObject var store: LizaBudgetStore
              @Environment(\.dismiss) private var dismiss
          
              let existing: Expense?
          
              @State private var amount: String
              @State private var category: LivingCategory
              @State private var note: String
              @State private var date: Date
              @State private var deleteConfirm = false
          
              init(existing: Expense? = nil) {
                  self.existing = existing
                  _amount = State(initialValue: existing.map { String(Int($0.amount)) } ?? "")
                  _category = State(initialValue: existing?.category ?? .food)
                  _note = State(initialValue: existing?.note ?? "")
                  _date = State(initialValue: existing?.date ?? Date())
              }
          
              var body: some View {
                  NavigationStack {
                      Form {
                          Section("Расход") {
                              TextField("Сумма", text: $amount)
                                  .keyboardType(.decimalPad)
          
                              Picker("Категория", selection: $category) {
                                  ForEach(LivingCategory.allCases) { item in
                                      Label(item.title, systemImage: item.systemImage).tag(item)
                                  }
                              }
          
                              TextField("Комментарий", text: $note)
                              DatePicker("Дата", selection: $date, displayedComponents: .date)
                          }
          
                          if existing != nil {
                              Section {
                                  Button("Удалить расход", role: .destructive) {
                                      deleteConfirm = true
                                  }
                              }
                          }
                      }
                      .navigationTitle(existing == nil ? "Добавить расход" : "Изменить расход")
                      .navigationBarTitleDisplayMode(.inline)
                      .toolbar {
                          ToolbarItem(placement: .cancellationAction) {
                              Button("Отмена") { dismiss() }
                          }
                          ToolbarItem(placement: .confirmationAction) {
                              Button("Сохранить") {
                                  let normalized = amount.replacingOccurrences(of: ",", with: ".")
                                  guard let value = Double(normalized), value > 0 else { return }
          
                                  if let existing {
                                      store.updateExpense(
                                          existing,
                                          amount: value,
                                          category: category,
                                          note: note.trimmingCharacters(in: .whitespacesAndNewlines),
                                          date: date
                                      )
                                  } else {
                                      store.addExpense(
                                          amount: value,
                                          category: category,
                                          note: note.trimmingCharacters(in: .whitespacesAndNewlines),
                                          date: date
                                      )
                                  }
                                  dismiss()
                              }

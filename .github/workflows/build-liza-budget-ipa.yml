          SWIFT

          cd LizaBudget
          xcodegen generate

      - name: Build unsigned app
        run: |
          cd LizaBudget
          xcodebuild \
            -project LizaBudget.xcodeproj \
            -scheme LizaBudget \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          cd LizaBudget
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LizaBudget.app Payload/
          zip -qry LizaBudget-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: LizaBudget-unsigned
          path: LizaBudget/LizaBudget-unsigned.ipa
          retention-days: 7

                  NavigationStack {
                      ScrollView {
                          LazyVStack(spacing: 14) {
                              header
                              hero
                              metrics
                              obligations
                              categories
                              history
                          }
                          .padding(.horizontal, 16)
                          .padding(.bottom, 28)
                      }
                      .background(Color.lizaBG.ignoresSafeArea())
                      .toolbar(.hidden, for: .navigationBar)
                      .sheet(isPresented: $showExpenseAdd) {
                          ExpenseEditorView().environmentObject(store)
                      }
                      .sheet(item: $editingExpense) { item in
                          ExpenseEditorView(existing: item).environmentObject(store)
                      }
                      .sheet(isPresented: $showIncome) {
                          IncomeEditorView(event: period.current, currentAmount: periodIncome)
                              .environmentObject(store)
                      }
